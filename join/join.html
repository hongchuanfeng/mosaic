<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="免费在线图片拼接工具，支持多张图片拼接成一张，自定义布局、间距、背景色" />

    <link rel="stylesheet" href="join.css">
</head>
<body>
    <header class="header-div">
        <nav class="navbar">
            <div class="nav-container">
                <button class="nav-toggle" id="navToggle" aria-label="切换导航菜单">
                    <span class="hamburger"></span>

                    <a href="../changebg/changebg.html" class="nav-link">背景更换</a>
                </div>
            </div>
        </nav>
        <h1 class="header-title">图片拼接工具</h1>
    </header>

    <!-- 移动端菜单遮罩层 -->
    <div class="nav-overlay" id="navOverlay"></div>

    <main class="main-container">
        <!-- 文件上传区域 -->
        <section class="upload-section">
            <div class="upload-area">
                <label for="fileInput" class="file-label">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">点击选择图片或拖拽到此处</div>
                    <div class="upload-hint">支持 JPG, PNG, GIF, BMP, WebP 格式</div>
                    <div class="upload-hint">支持批量上传，最多20张图片</div>
                </label>
                <input type="file" id="fileInput" accept="image/*" multiple />
            </div>
        </section>

        <!-- 拼接设置区域 -->
        <section class="settings-section" id="settingsSection" style="display: none;">
            <div class="settings-container">
                <h3>拼接设置</h3>
                
                <div class="settings-grid">
                    <!-- 布局类型选择 -->
                    <div class="setting-group">
                        <label class="setting-label">布局类型</label>
                        <div class="layout-types">
                            <label class="radio-label">
                                <input type="radio" name="layoutType" value="horizontal" checked />
                                <span class="radio-mark"></span>
                                水平拼接
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="layoutType" value="vertical" />
                                <span class="radio-mark"></span>
                                垂直拼接
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="layoutType" value="grid" />
                                <span class="radio-mark"></span>
                                网格拼接
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="layoutType" value="custom" />
                                <span class="radio-mark"></span>
                                自定义布局
                            </label>
                        </div>
                    </div>

                    <!-- 网格设置 -->
                    <div class="setting-group" id="gridSettings" style="display: none;">
                        <label class="setting-label">网格设置</label>
                        <div class="grid-controls">
                            <div class="grid-input-group">
                                <label>列数</label>
                                <input type="number" id="gridCols" min="1" max="10" value="2" />
                            </div>
                            <div class="grid-input-group">
                                <label>行数</label>
                                <input type="number" id="gridRows" min="1" max="10" value="2" />
                            </div>
                        </div>
                    </div>

                    <!-- 图片尺寸设置 -->
                    <div class="setting-group">
                        <label class="setting-label">图片尺寸</label>
                        <div class="size-controls">
                            <div class="size-option">
                                <label class="radio-label">
                                    <input type="radio" name="sizeMode" value="original" checked />
                                    <span class="radio-mark"></span>
                                    保持原尺寸
                                </label>
                            </div>
                            <div class="size-option">
                                <label class="radio-label">
                                    <input type="radio" name="sizeMode" value="uniform" />
                                    <span class="radio-mark"></span>
                                    统一尺寸
                                </label>
                            </div>
                            <div class="size-option">
                                <label class="radio-label">
                                    <input type="radio" name="sizeMode" value="custom" />
                                    <span class="radio-mark"></span>
                                    自定义尺寸
                                </label>
                            </div>
                        </div>
                        <div class="size-inputs" id="sizeInputs" style="display: none;">
                            <div class="size-input-group">
                                <label>宽度</label>
                                <input type="number" id="customWidth" min="50" max="2000" value="400" />
                            </div>
                            <div class="size-input-group">
                                <label>高度</label>
                                <input type="number" id="customHeight" min="50" max="2000" value="300" />
                            </div>
                        </div>
                    </div>

                    <!-- 间距设置 -->
                    <div class="setting-group">
                        <label class="setting-label">间距设置</label>
                        <div class="spacing-controls">
                            <div class="spacing-group">
                                <label>水平间距</label>
                                <input type="range" id="horizontalSpacing" min="0" max="50" value="0" />
                                <span id="horizontalSpacingValue">0px</span>
                            </div>
                            <div class="spacing-group">
                                <label>垂直间距</label>
                                <input type="range" id="verticalSpacing" min="0" max="50" value="0" />
                                <span id="verticalSpacingValue">0px</span>
                            </div>
                        </div>
                    </div>

                    <!-- 背景设置 -->
                    <div class="setting-group">
                        <label class="setting-label">背景设置</label>
                        <div class="background-controls">
                            <div class="background-option">
                                <label class="radio-label">
                                    <input type="radio" name="backgroundType" value="transparent" />
                                    <span class="radio-mark"></span>
                                    透明背景
                                </label>
                            </div>
                            <div class="background-option">
                                <label class="radio-label">
                                    <input type="radio" name="backgroundType" value="color" checked />
                                    <span class="radio-mark"></span>
                                    纯色背景
                                </label>
                            </div>
                            <div class="background-option">
                                <label class="radio-label">
                                    <input type="radio" name="backgroundType" value="gradient" />
                                    <span class="radio-mark"></span>
                                    渐变背景
                                </label>
                            </div>
                        </div>
                        <div class="background-color-group" id="backgroundColorGroup">
                            <label>背景颜色</label>
                            <div class="color-input-group">
                                <input type="color" id="backgroundColor" value="#ffffff" />
                                <input type="text" id="backgroundColorHex" value="#ffffff" class="color-hex" />
                            </div>
                        </div>
                    </div>

                    <!-- 输出设置 -->
                    <div class="setting-group">
                        <label class="setting-label">输出设置</label>
                        <div class="output-options">
                            <select id="outputFormat" class="format-select">
                                <option value="png">PNG (.png)</option>
                                <option value="jpeg">JPEG (.jpg)</option>
                                <option value="webp">WebP (.webp)</option>
                            </select>
                            <div class="quality-group" id="qualityGroup" style="display: none;">
                                <label>图片质量</label>
                                <input type="range" id="imageQuality" min="0.1" max="1" step="0.1" value="0.9" />
                                <span id="imageQualityValue">90%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="previewBtn" class="btn btn-primary">预览拼接</button>
                    <button id="joinBtn" class="btn btn-success">开始拼接</button>
                    <button id="clearBtn" class="btn btn-outline">清空列表</button>
                </div>
            </div>
        </section>

        <!-- 图片列表区域 -->
        <section class="images-section" id="imagesSection" style="display: none;">
            <div class="images-container">
                <h3>图片列表</h3>
                <div class="images-grid" id="imagesGrid">
                    <!-- 图片项将动态添加到这里 -->
                </div>
            </div>
        </section>

        <!-- 预览区域 -->
        <section class="preview-section" id="previewSection" style="display: none;">
            <div class="preview-container">
                <h3>拼接预览</h3>
                <div class="preview-canvas-container">
                    <canvas id="previewCanvas"></canvas>
                </div>
                <div class="preview-actions">
                    <button id="downloadBtn" class="btn btn-success">下载拼接图片</button>
                    <button id="downloadPngBtn" class="btn btn-info">下载PNG</button>
                    <button id="downloadJpgBtn" class="btn btn-warning">下载JPG</button>
                </div>
            </div>
        </section>

        <!-- 使用说明 -->
        <section class="instructions-section">
            <div class="instructions-container">
                <h3>使用说明</h3>
                <div class="instructions-content">
                    <div class="instruction-item">
                        <h4>🖼️ 图片上传</h4>
                        <p>支持拖拽上传或点击选择，最多可上传20张图片进行拼接</p>
                    </div>
                    <div class="instruction-item">
                        <h4>📐 布局选择</h4>
                        <p>支持水平拼接、垂直拼接、网格拼接和自定义布局方式</p>
                    </div>
                    <div class="instruction-item">
                        <h4>🎨 样式设置</h4>
                        <p>可调整图片尺寸、间距、背景色等参数，打造个性化拼接效果</p>
                    </div>
                    <div class="instruction-item">
                        <h4>💾 格式输出</h4>
                        <p>支持PNG、JPG、WebP等多种格式输出，满足不同使用需求</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Navigation menu toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            // Check if mobile device
            function isMobile() {
                return window.innerWidth <= 768;
            }
            
            function toggleMenu() {
                if (isMobile()) {
                    navMenu.classList.toggle('nav-menu-active');
                    navToggle.classList.toggle('nav-toggle-active');
                    navOverlay.classList.toggle('nav-overlay-active');
                }
            }
            
            function closeMenu() {
                if (isMobile()) {
                    navMenu.classList.remove('nav-menu-active');
                    navToggle.classList.remove('nav-toggle-active');
                    navOverlay.classList.remove('nav-overlay-active');
                }
            }
            
            // Add event listeners only for mobile
            if (navToggle) {
                navToggle.addEventListener('click', toggleMenu);
            }
            
            if (navOverlay) {
                navOverlay.addEventListener('click', closeMenu);
            }
            
            // Close mobile menu when clicking menu items
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    if (isMobile()) {
                        closeMenu();
                    }
                });
            });
            
            // Close menu when window is resized
            window.addEventListener('resize', function() {
                if (!isMobile()) {
                    closeMenu();
                }
            });
        });
    </script>
    <script src="join.js"></script>
</body>
</html>
