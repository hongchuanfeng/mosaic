        .navbar { 
            background: rgba(255, 255, 255, 0.1) !important; 
            backdrop-filter: blur(10px) !important; 
            -webkit-backdrop-filter: blur(10px) !important; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;

        .header-div {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;

        /* 移动端抽屉菜单与 index 一致 */
        @media (max-width: 768px) {
            .header-div, .navbar, .nav-container { overflow: visible !important; }
            .header-div, .navbar, .nav-container { transform: none !important; -webkit-transform: none !important; }
            .header-div, .navbar, .nav-container { contain: unset !important; }
            .nav-toggle { display: inline-block; }
            .nav-toggle { 
                position: relative; z-index: 10002; 
                display: inline-flex; align-items: center; justify-content: center; 
                width: 40px; height: 40px; padding: 0; margin-left: 8px; 
                background: rgba(255,255,255,.55); border-radius: 8px; 
                box-shadow: 0 1px 3px rgba(0,0,0,.2);
            }
            .hamburger { width: 22px; height: 3px; background: #333; margin: 3px 0; border-radius: 2px; }
            .nav-toggle.nav-toggle-active .hamburger:nth-child(1){ transform: translateY(7px) rotate(45deg);} 
            .nav-toggle.nav-toggle-active .hamburger:nth-child(2){ opacity:1; } 
            .nav-toggle.nav-toggle-active .hamburger:nth-child(3){ transform: translateY(-7px) rotate(-45deg);} 
            .nav-menu { position: fixed; top:0; bottom:0; left:0; width:78%; max-width:360px; background:#fff; box-shadow:2px 0 10px rgba(0,0,0,.12); display:block; padding: calc(env(safe-area-inset-top,0) + 12px) 12px 24px; overflow-y:auto; -webkit-overflow-scrolling:touch; transform: translateX(-100%); transition: transform .25s ease; z-index: 10001; }
            .nav-menu.nav-menu-active { transform: translateX(0); }
            .nav-menu .nav-link { display:flex; align-items:center; padding:0; border-bottom:1px solid #f2f2f2; margin:10px 0; }
            .nav-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:10000; display:block; }
            .nav-overlay.nav-overlay-active { opacity:1; pointer-events:auto; }
        }

<body>

        <h1 class="header-title">文字生成图片</h1>

    <!-- 移动端菜单遮罩层 -->
    <div class="nav-overlay" id="navOverlay"></div>

    <main class="main-container">
        <!-- 文字输入区域 -->
        <section class="input-section">
            <div class="input-container">
                <h3>文字设置</h3>
                <div class="input-group">
                    <label for="textInput" class="input-label">输入文字</label>
                    <textarea id="textInput" class="text-input" placeholder="请输入要生成图片的文字内容..." rows="4"></textarea>
                </div>
                
                <div class="settings-grid">
                    <!-- 字体设置 -->
                    <div class="setting-group">
                        <label class="setting-label">字体设置</label>
                        <div class="font-controls">
                            <div class="font-family-group">
                                <label>字体</label>
                                <select id="fontFamily" class="font-select">
                                    <option value="Arial, sans-serif">Arial</option>
                                    <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
                                    <option value="'SimSun', serif">宋体</option>
                                    <option value="'SimHei', sans-serif">黑体</option>
                                    <option value="'KaiTi', serif">楷体</option>
                                    <option value="'FangSong', serif">仿宋</option>
                                    <option value="'Times New Roman', serif">Times New Roman</option>
                                    <option value="'Courier New', monospace">Courier New</option>
                                    <option value="'Georgia', serif">Georgia</option>
                                    <option value="'Verdana', sans-serif">Verdana</option>
                                </select>
                            </div>
                            <div class="font-size-group">
                                <label>字体大小</label>
                                <input type="range" id="fontSize" min="12" max="200" value="48" />
                                <span id="fontSizeValue">48px</span>
                            </div>
                            <div class="font-weight-group">
                                <label>字体粗细</label>
                                <select id="fontWeight" class="font-select">
                                    <option value="normal">正常</option>
                                    <option value="bold">粗体</option>
                                    <option value="lighter">细体</option>
                                    <option value="bolder">特粗</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 颜色设置 -->
                    <div class="setting-group">
                        <label class="setting-label">颜色设置</label>
                        <div class="color-controls">
                            <div class="color-group">
                                <label>文字颜色</label>
                                <div class="color-input-group">
                                    <input type="color" id="textColor" value="#000000" />
                                    <input type="text" id="textColorHex" value="#000000" class="color-hex" />
                                </div>
                            </div>
                            <div class="color-group">
                                <label>背景颜色</label>
                                <div class="color-input-group">
                                    <input type="color" id="backgroundColor" value="#ffffff" />
                                    <input type="text" id="backgroundColorHex" value="#ffffff" class="color-hex" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 布局设置 -->
                    <div class="setting-group">
                        <label class="setting-label">布局设置</label>
                        <div class="layout-controls">
                            <div class="canvas-size-group">
                                <label>画布尺寸</label>
                                <div class="size-inputs">
                                    <input type="number" id="canvasWidth" min="100" max="2000" value="800" placeholder="宽度" />
                                    <span>×</span>
                                    <input type="number" id="canvasHeight" min="100" max="2000" value="400" placeholder="高度" />
                                </div>
                            </div>
                            <div class="text-align-group">
                                <label>文字对齐</label>
                                <div class="align-buttons">
                                    <button class="align-btn" data-align="left">左对齐</button>
                                    <button class="align-btn active" data-align="center">居中</button>
                                    <button class="align-btn" data-align="right">右对齐</button>
                                </div>
                            </div>
                            <div class="padding-group">
                                <label>内边距</label>
                                <input type="range" id="padding" min="0" max="100" value="20" />
                                <span id="paddingValue">20px</span>
                            </div>
                        </div>
                    </div>

                    <!-- 效果设置 -->
                    <div class="setting-group">
                        <label class="setting-label">效果设置</label>
                        <div class="effect-controls">
                            <label class="checkbox-label">
                                <input type="checkbox" id="addShadow" />
                                <span class="checkmark"></span>
                                添加阴影
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="addBorder" />
                                <span class="checkmark"></span>
                                添加边框
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="addGradient" />
                                <span class="checkmark"></span>
                                渐变背景
                            </label>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="generateBtn" class="btn btn-primary">生成图片</button>
                    <button id="previewBtn" class="btn btn-secondary">预览效果</button>
                    <button id="clearBtn" class="btn btn-outline">清空内容</button>
                </div>
            </div>
        </section>

        <!-- 预览区域 -->
        <section class="preview-section" id="previewSection" style="display: none;">
            <div class="preview-container">
                <h3>预览效果</h3>
                <div class="preview-canvas-container">
                    <canvas id="previewCanvas" width="800" height="400"></canvas>
                </div>
                <div class="preview-actions">
                    <button id="downloadBtn" class="btn btn-success">下载图片</button>
                    <button id="downloadPngBtn" class="btn btn-info">下载PNG</button>
                    <button id="downloadJpgBtn" class="btn btn-warning">下载JPG</button>
                </div>
            </div>
        </section>

        <!-- 使用说明 -->
        <section class="instructions-section">
            <div class="instructions-container">
                <h3>使用说明</h3>
                <div class="instructions-content">
                    <div class="instruction-item">
                        <h4>✏️ 文字输入</h4>
                        <p>在文字输入框中输入要生成图片的文字内容，支持多行文字</p>
                    </div>
                    <div class="instruction-item">
                        <h4>🎨 样式设置</h4>
                        <p>自定义字体、大小、颜色、背景色等样式，打造个性化图片</p>
                    </div>
                    <div class="instruction-item">
                        <h4>📐 布局调整</h4>
                        <p>调整画布尺寸、文字对齐方式、内边距等布局参数</p>
                    </div>
                    <div class="instruction-item">
                        <h4>✨ 特效添加</h4>
                        <p>添加阴影、边框、渐变背景等特效，让图片更加精美</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 导航菜单切换功能（修复遮罩层问题：点击按钮时按钮在遮罩之上）
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            const navOriginalContainer = navMenu ? navMenu.parentElement : null;
            
            function isMobile() { return window.innerWidth <= 768; }
            
            function toggleMenu() {
                if (!isMobile()) return;
                // 确保按钮层级高于遮罩
                if (navToggle) navToggle.style.zIndex = '10002';
                navMenu.classList.toggle('nav-menu-active');
                navToggle.classList.toggle('nav-toggle-active');
                navOverlay.classList.toggle('nav-overlay-active');
                
                if (navMenu.classList.contains('nav-menu-active')) {
                    navMenu.style.transform = 'translateX(0)';
                    document.body.classList.add('menu-open');
                    document.documentElement.classList.add('menu-open');
                    navMenu.style.overflowY = 'scroll';
                    navMenu.style.overflowX = 'hidden';
                    navMenu.style.height = '100vh';
                    navMenu.style.touchAction = 'pan-y';
                    navMenu.style.webkitOverflowScrolling = 'touch';
                } else {
                    navMenu.style.transform = 'translateX(-100%)';
                    document.body.classList.remove('menu-open');
                    document.documentElement.classList.remove('menu-open');
                }
            }
            
            function closeMenu() {
                if (!isMobile()) return;
                navMenu.classList.remove('nav-menu-active');
                navToggle.classList.remove('nav-toggle-active');
                navOverlay.classList.remove('nav-overlay-active');
                navMenu.style.transform = 'translateX(-100%)';
                document.body.classList.remove('menu-open');
                document.documentElement.classList.remove('menu-open');
            }
            
            function promoteMenuForMobile(){
                if (!navMenu) return;
                if (isMobile()) {
                    if (navMenu.parentElement !== document.body) document.body.appendChild(navMenu);
                } else if (navOriginalContainer && navMenu.parentElement !== navOriginalContainer) {
                    navOriginalContainer.appendChild(navMenu);
                }
            }
            promoteMenuForMobile();
            
            if (navToggle) navToggle.addEventListener('click', toggleMenu);
            if (navOverlay) navOverlay.addEventListener('click', closeMenu);
            
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', function(){ if(isMobile()) closeMenu(); });
            });
            
            window.addEventListener('resize', function(){
                if (!isMobile()) closeMenu();
                promoteMenuForMobile();
            });
        });
    </script>
    <script src="text.js"></script>
</body>
</html>
