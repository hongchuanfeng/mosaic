        /* 导航图标与布局 */
        .nav-menu { display: flex; flex-wrap: wrap; gap: 8px; }
        .nav-link { padding: 0; display: inline-flex; align-items: center; }
        .nav-ico { display: inline-block; margin-right: 0; font-size: 16px; line-height: 1; }
        .nav-toggle { display: none; background: transparent; border: none; padding: 8px; cursor: pointer; }
        .hamburger { display: block; width: 22px; height: 2px; background: #333; margin: 5px 0; transition: transform .25s ease, opacity .25s ease; }
        /* PC端 nav-link 间距 */
        @media (min-width: 769px) { .nav-link { padding: 5px 0; } }
        /* 移动端抽屉菜单 */
        @media (max-width: 768px) {
            .nav-toggle { display: inline-block; }
            .nav-menu {
                position: fixed; top:0; bottom:0; left:0; width:78%; max-width:360px;
                background:#fff; box-shadow:2px 0 10px rgba(0,0,0,.12);
                display:block; padding: calc(env(safe-area-inset-top,0) + 12px) 12px 24px; overflow-y:auto; -webkit-overflow-scrolling:touch;
                transform: translateX(-100%); transition: transform .25s ease; z-index:10001; will-change: transform;
            }
            .nav-menu.nav-menu-active { transform: translateX(0); }
            .nav-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:10000; display:block; }
            .nav-overlay.nav-overlay-active { opacity:1; pointer-events:auto; }
            .nav-menu .nav-link { margin:10px 0; }
            .nav-toggle.nav-toggle-active .hamburger:nth-child(1){transform:translateY(7px) rotate(45deg);} 
            .nav-toggle.nav-toggle-active .hamburger:nth-child(2){opacity:0;} 
            .nav-toggle.nav-toggle-active .hamburger:nth-child(3){transform:translateY(-7px) rotate(-45deg);} 
        }
    </style>
</head>

    <main class="main-container">
        <!-- 文件上传区域 -->
        <section class="upload-section">

        <!-- 图片编辑区域 -->
        <section class="editor-section" id="editorSection" style="display: none;">

                        <button id="resetBtn" class="tool-btn">重置</button>
                    </div>
                    <div class="tool-group">
                        <button id="downloadBtn" class="tool-btn download-btn">下载裁剪图片</button>
                    </div>
                </div>

                <!-- 图片显示区域 -->
                <div class="image-container">
                    <div class="image-wrapper" id="imageWrapper">

                            <div class="crop-box" id="cropBox">
                                <div class="crop-handle nw"></div>
                                <div class="crop-handle ne"></div>
                                <div class="crop-handle sw"></div>
                                <div class="crop-handle se"></div>
                                <div class="crop-handle n"></div>
                                <div class="crop-handle s"></div>
                                <div class="crop-handle w"></div>
                                <div class="crop-handle e"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 预览区域 -->
                <div class="preview-section">
                    <h3>裁剪预览</h3>
                    <div class="preview-container">
                        <canvas id="previewCanvas"></canvas>
                    </div>
                    <div class="preview-info">
                        <span id="cropSize">尺寸: 0 x 0</span>
                        <span id="cropRatio">比例: 1:1</span>
                    </div>

    <div style="max-width:1000px;margin:12px auto 0;color:#666;font-size:14px;line-height:1.6;padding:0 12px;">
        <div style="margin-top:8px;color:#999;">版权：传道AI</div>
    </div>

    <script>
        // Navigation menu toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            const navOriginalContainer = navMenu ? navMenu.parentElement : null;
            
            // Check if mobile device
            function isMobile() {
                return window.innerWidth <= 768;
            }
            
            function toggleMenu() {
                if (isMobile()) {
                    navMenu.classList.toggle('nav-menu-active');
                    navToggle.classList.toggle('nav-toggle-active');
                    navOverlay.classList.toggle('nav-overlay-active');
                }
            }
            
            function closeMenu() {
                if (isMobile()) {
                    navMenu.classList.remove('nav-menu-active');
                    navToggle.classList.remove('nav-toggle-active');
                    navOverlay.classList.remove('nav-overlay-active');
                }
            }
            
            // Add event listeners only for mobile
            if (navToggle) {
                navToggle.addEventListener('click', toggleMenu);
            }
            
            if (navOverlay) {
                navOverlay.addEventListener('click', closeMenu);
            }
            
            // 移动端点击跳转与抽屉层级处理
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                let startX = 0, startY = 0, startT = 0;
                const threshold = 8;
                function onStart(e){ if(!isMobile()) return; const t=e.touches?e.touches[0]:e; startX=t.clientX; startY=t.clientY; startT=Date.now(); }
                function onEnd(e){ if(!isMobile()) return; const t=e.changedTouches?e.changedTouches[0]:e; const dx=Math.abs(t.clientX-startX); const dy=Math.abs(t.clientY-startY); const dt=Date.now()-startT; if(dx<threshold&&dy<threshold&&dt<1500){ const href=link.getAttribute('href'); if(href){ e.preventDefault(); e.stopPropagation(); window.location.assign(href); } } }
                link.addEventListener('touchstart', onStart, {passive:true, capture:true});
                link.addEventListener('touchend', onEnd, {passive:false, capture:true});
                link.addEventListener('mousedown', onStart, true);
                link.addEventListener('mouseup', onEnd, true);
                link.addEventListener('click', function(e){ if(!isMobile()) return; const href=link.getAttribute('href'); if(href){ e.preventDefault(); e.stopPropagation(); window.location.assign(href);} }, true);
            });
            
            // Close menu when window is resized
            window.addEventListener('resize', function() {
                if (!isMobile()) {
                    closeMenu();
                }
                // 提升菜单到 body 直下确保层级
                if (isMobile()) {
                    if (navMenu.parentElement !== document.body) document.body.appendChild(navMenu);
                } else if (navOriginalContainer && navMenu.parentElement !== navOriginalContainer) {
                    navOriginalContainer.appendChild(navMenu);
                }
            });
        });
    </script>
