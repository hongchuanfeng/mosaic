    <script>
        // 统一的移动端导航逻辑
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            const navOriginalContainer = navMenu ? navMenu.parentElement : null;

            function isMobile(){ return window.innerWidth <= 768; }

            function toggleMenu(){
                if (!isMobile()) return;
                navMenu.classList.toggle('nav-menu-active');
                navToggle.classList.toggle('nav-toggle-active');
                navOverlay.classList.toggle('nav-overlay-active');
                if (navMenu.classList.contains('nav-menu-active')){
                    navMenu.style.transform = 'translateX(0)';
                    document.body.classList.add('menu-open');
                    document.documentElement.classList.add('menu-open');
                    navMenu.style.overflowY = 'scroll';
                    navMenu.style.overflowX = 'hidden';
                    navMenu.style.height = '100vh';
                    navMenu.style.touchAction = 'pan-y';
                    navMenu.style.webkitOverflowScrolling = 'touch';
                } else {
                    navMenu.style.transform = 'translateX(-100%)';
                    document.body.classList.remove('menu-open');
                    document.documentElement.classList.remove('menu-open');
                }
            }

            function closeMenu(){
                if (!isMobile()) return;
                navMenu.classList.remove('nav-menu-active');
                navToggle.classList.remove('nav-toggle-active');
                navOverlay.classList.remove('nav-overlay-active');
                navMenu.style.transform = 'translateX(-100%)';
                document.body.classList.remove('menu-open');
                document.documentElement.classList.remove('menu-open');
            }

            function promoteMenuForMobile(){
                if (!navMenu) return;
                if (isMobile()){
                    if (navMenu.parentElement !== document.body) document.body.appendChild(navMenu);
                } else if (navOriginalContainer && navMenu.parentElement !== navOriginalContainer){
                    navOriginalContainer.appendChild(navMenu);
                }
            }
            promoteMenuForMobile();

            if (navToggle) navToggle.addEventListener('click', toggleMenu);
            if (navOverlay) navOverlay.addEventListener('click', closeMenu);

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => { link.addEventListener('click', function(){ if(isMobile()) closeMenu(); }); });

            window.addEventListener('resize', function(){
                if (!isMobile()) closeMenu();
                promoteMenuForMobile();
            });
        });
    </script>
