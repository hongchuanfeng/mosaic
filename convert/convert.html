<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta name="description" content="免费在线图片格式转换工具，支持JPG、PNG、WebP、BMP等格式互转，支持批量转换和质量调节" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7274710287377352"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="convert.css">
</head>
<body>
    <header class="header-div">
        <nav class="navbar">
            <div class="nav-container">
                <button class="nav-toggle" id="navToggle" aria-label="切换导航菜单">
                    <span class="hamburger"></span>
                    <span class="hamburger"></span>
                    <span class="hamburger"></span>
                </button>
                <div class="nav-menu" id="navMenu">
        
                    <a href="../index.html" class="nav-link">马赛克</a>
                    <a href="../crop/crop.html" class="nav-link">图片裁剪</a>
                    <a href="convert.html" class="nav-link">格式转换</a>
                    <a href="../icon/icon.html" class="nav-link">icon生成</a>
                    <a href="../compress/compress.html" class="nav-link">图片压缩</a>
                    <a href="../blank/blank.html" class="nav-link">彩图转黑白</a>
                    <a href="../watermark/watermark.html" class="nav-link">图片加水印</a>
                    <a href="../removewm/removewm.html" class="nav-link">图片去水印</a>
                    <a href="../nine/nine.html" class="nav-link">九宫格切图</a>
                    <a href="../text/text.html" class="nav-link">文字转图片</a>
                    <a href="../join/join.html" class="nav-link">图片拼接</a>
                    <a href="../textToimage/textToimage.html" class="nav-link">图片加文字</a>
                    <a href="../corner/corner.html" class="nav-link">圆角处理</a>
                    <a href="../expand/expand.html" class="nav-link">图片放大</a>
                    <a href="../old/old.html" class="nav-link">老照片修复</a>
                    <a href="../bg/bg.html" class="nav-link">黑白上色</a>
                    <a href="../removebg/removebg.html" class="nav-link">背景透明</a>
                    <a href="../changebg/changebg.html" class="nav-link">背景更换</a>
                </div>
            </div>
        </nav>
        <h1 class="header-title">图片格式转换</h1>
    </header>

    <!-- 移动端菜单遮罩层 -->
    <div class="nav-overlay" id="navOverlay"></div>

    <main class="main-container">
        <!-- 文件上传区域 -->
        <section class="upload-section">
            <div class="upload-area">
                <label for="fileInput" class="file-label">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">点击选择图片或拖拽到此处</div>
                    <div class="upload-hint">支持 JPG, PNG, GIF, BMP, WebP 格式</div>
                    <div class="upload-hint">支持批量上传，最多10张图片</div>
                </label>
                <input type="file" id="fileInput" accept="image/*" multiple />
            </div>
        </section>

        <!-- 转换设置区域 -->
        <section class="settings-section" id="settingsSection" style="display: none;">
            <div class="settings-container">
                <h3>转换设置</h3>
                
                <div class="settings-grid">
                    <!-- 输出格式选择 -->
                    <div class="setting-group">
                        <label class="setting-label">输出格式</label>
                        <select id="outputFormat" class="format-select">
                            <option value="jpeg">JPEG (.jpg)</option>
                            <option value="png">PNG (.png)</option>
                            <option value="webp">WebP (.webp)</option>
                            <option value="bmp">BMP (.bmp)</option>
                        </select>
                    </div>

                    <!-- 质量设置 -->
                    <div class="setting-group" id="qualityGroup">
                        <label class="setting-label">图片质量</label>
                        <div class="quality-control">
                            <input type="range" id="qualitySlider" min="10" max="100" value="90" />
                            <span id="qualityValue">90%</span>
                        </div>
                    </div>

                    <!-- 尺寸设置 -->
                    <div class="setting-group">
                        <label class="setting-label">输出尺寸</label>
                        <div class="size-controls">
                            <label class="checkbox-label">
                                <input type="checkbox" id="resizeEnabled" />
                                <span class="checkmark"></span>
                                调整尺寸
                            </label>
                            <div class="size-inputs" id="sizeInputs" style="display: none;">
                                <input type="number" id="widthInput" placeholder="宽度" min="1" />
                                <span>×</span>
                                <input type="number" id="heightInput" placeholder="高度" min="1" />
                                <label class="checkbox-label">
                                    <input type="checkbox" id="keepAspectRatio" checked />
                                    <span class="checkmark"></span>
                                    保持比例
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 压缩设置 -->
                    <div class="setting-group">
                        <label class="setting-label">压缩选项</label>
                        <div class="compression-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="optimizeSize" />
                                <span class="checkmark"></span>
                                优化文件大小
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="removeMetadata" />
                                <span class="checkmark"></span>
                                移除元数据
                            </label>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="convertAllBtn" class="btn btn-primary">转换所有图片</button>
                    <button id="clearAllBtn" class="btn btn-secondary">清空列表</button>
                </div>
            </div>
        </section>

        <!-- 图片列表区域 -->
        <section class="images-section" id="imagesSection" style="display: none;">
            <div class="images-container">
                <h3>图片列表</h3>
                <div class="images-grid" id="imagesGrid">
                    <!-- 图片项将动态添加到这里 -->
                </div>
            </div>
        </section>

        <!-- 进度区域 -->
        <section class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-container">
                <h3>转换进度</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备中...</div>
            </div>
        </section>

        <!-- 结果区域 -->
        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="results-container">
                <h3>转换结果</h3>
                <div class="results-actions">
                    <button id="downloadAllBtn" class="btn btn-success">下载全部</button>
                    <button id="downloadZipBtn" class="btn btn-info">打包下载</button>
                </div>
                <div class="results-grid" id="resultsGrid">
                    <!-- 转换结果将显示在这里 -->
                </div>
            </div>
        </section>
    </main>

    <script>
        // Navigation menu toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            // Check if mobile device
            function isMobile() {
                return window.innerWidth <= 768;
            }
            
            function toggleMenu() {
                if (isMobile()) {
                    navMenu.classList.toggle('nav-menu-active');
                    navToggle.classList.toggle('nav-toggle-active');
                    navOverlay.classList.toggle('nav-overlay-active');
                }
            }
            
            function closeMenu() {
                if (isMobile()) {
                    navMenu.classList.remove('nav-menu-active');
                    navToggle.classList.remove('nav-toggle-active');
                    navOverlay.classList.remove('nav-overlay-active');
                }
            }
            
            // Add event listeners only for mobile
            if (navToggle) {
                navToggle.addEventListener('click', toggleMenu);
            }
            
            if (navOverlay) {
                navOverlay.addEventListener('click', closeMenu);
            }
            
            // Close mobile menu when clicking menu items
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    if (isMobile()) {
                        closeMenu();
                    }
                });
            });
            
            // Close menu when window is resized
            window.addEventListener('resize', function() {
                if (!isMobile()) {
                    closeMenu();
                }
            });
        });
    </script>
    <script src="convert.js"></script>
</body>
</html>
